name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # pnpm is already on the node toolchain image; corepack pins it to the
      # version the lockfile was written with.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The tokens are generated from JSON, so regenerate before building:
      # a token added to the source and not to the generated output fails here.
      - run: pnpm generate-tokens
      - run: pnpm build
